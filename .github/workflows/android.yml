name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block files over 100 MB
        run: |
          big=$(git ls-files -z | xargs -0 find 2>/dev/null -maxdepth 0 -type f -size +100M)
          if [ -n "$big" ]; then
            echo "::error::Files over 100 MB are not allowed:"; echo "$big"; exit 1
          fi

      # Robolectric's SDK 36 sandbox needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Unit & screenshot tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hid-remote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
