name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block files over 100 MB
        shell: bash
        run: |
          limit=$((100 * 1024 * 1024))
          big=""
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt "$limit" ]; then big="$big$f ($((size / 1024 / 1024)) MB)"$'\n'; fi
          done < <(git ls-files -z)
          if [ -n "$big" ]; then
            echo "::error::Files over 100 MB are not allowed:"
            printf '%s' "$big"
            exit 1
          fi
          echo "All tracked files are under 100 MB ($(git ls-files | wc -l) files checked)."

      # Robolectric's SDK 36 sandbox needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Unit & screenshot tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hid-remote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
